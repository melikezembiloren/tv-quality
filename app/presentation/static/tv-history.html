<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TV Sorgula — QualiTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg:            #e7e9eb;
    --panel:         #f7f8f9;
    --panel-2:       #eef0f1;
    --well:          #e1e4e6;
    --ink:           #14181b;
    --ink-2:         #4b545c;
    --ink-3:         #7c858c;
    --border:        #d1d6d9;
    --border-strong: #b3bac0;
    --good:        #1c8a4d;
    --good-ink:    #157a42;
    --good-soft:   #dbefe1;
    --warn:        #a8730a;
    --warn-ink:    #7a4c06;
    --warn-soft:   #f5e8cc;
    --warn-strong: #b0430f;
    --crit:        #c1272d;
    --crit-ink:    #c1272d;
    --crit-soft:   #f7dbdc;
    --focus:     #2f6fed;
    --selection-ink: #ffffff;
    --shadow-1: 0 1px 2px rgba(20,24,27,.06);
    --shadow-2: 0 8px 24px -8px rgba(20,24,27,.22);
    --shadow-well-inset: rgba(0,0,0,.18);
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "Consolas", monospace;
    --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b0d0f; --panel: #16181b; --panel-2: #1c1f22; --well: #101214;
      --ink: #f1f2f3; --ink-2: #a7adb2; --ink-3: #767d82;
      --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.18);
      --good: #2fd274; --good-ink: var(--good); --good-soft: rgba(47,210,116,.16);
      --warn: #ffb648;  --warn-ink: var(--warn); --warn-soft: rgba(255,182,72,.16); --warn-strong: #ff8a3d;
      --crit: #ff5c5c;  --crit-ink: var(--crit); --crit-soft: rgba(255,92,92,.18);
      --focus: #6ea8ff;
      --selection-ink: var(--bg);
      --shadow-1: 0 1px 2px rgba(0,0,0,.4);
      --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0d0f; --panel: #16181b; --panel-2: #1c1f22; --well: #101214;
    --ink: #f1f2f3; --ink-2: #a7adb2; --ink-3: #767d82;
    --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.18);
    --good: #2fd274; --good-ink: var(--good); --good-soft: rgba(47,210,116,.16);
    --warn: #ffb648;  --warn-ink: var(--warn); --warn-soft: rgba(255,182,72,.16); --warn-strong: #ff8a3d;
    --crit: #ff5c5c;  --crit-ink: var(--crit); --crit-soft: rgba(255,92,92,.18);
    --focus: #6ea8ff;
    --selection-ink: var(--bg);
    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { scrollbar-color: var(--border-strong) transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background: var(--focus); color: var(--selection-ink); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid var(--bg); }

  .page { max-width: 760px; margin: 0 auto; padding: 40px 24px 88px; display: flex; flex-direction: column; gap: 20px; }
  .masthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: clamp(19.5px, 2.64vw, 26.5px); margin: 0 0 6px; letter-spacing: -0.01em; font-weight: 400; }
  .lineage { color: var(--ink-2); font-size: 11.5px; max-width: 52ch; line-height: 1.5; margin: 0; }
  a.back { color: var(--ink-3); font-size: 11px; text-decoration: none; }
  a.back:hover { color: var(--ink); }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--ink-2);
    cursor: pointer; transition: border-color .15s ease, color .15s ease, transform .1s ease; flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; }

  .search-row { display: flex; gap: 10px; }
  input#serial-input {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--well);
    border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; flex: 1;
    font-family: var(--font-mono); letter-spacing: 0.02em; box-shadow: inset 0 1px 3px var(--shadow-well-inset);
  }
  input#serial-input:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
  button.search-btn {
    font: inherit; font-size: 11.5px; font-weight: 600; color: var(--bg);
    background: var(--ink); border: 1px solid var(--ink); border-radius: 8px;
    padding: 12px 22px; cursor: pointer; white-space: nowrap; transition: opacity .15s ease, transform .1s ease;
  }
  button.search-btn:hover { opacity: 0.86; }
  button.search-btn:active { transform: scale(.98); }
  button.search-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  section.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px 20px; box-shadow: var(--shadow-1); }
  h2 { font-size: 10px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); }
  .panel-sub { font-size: 11px; color: var(--ink-3); font-family: var(--font-mono); font-weight: 400; text-transform: none; letter-spacing: 0; }

  .tv-meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 20px; }
  @media (max-width: 620px) { .tv-meta { grid-template-columns: repeat(2, 1fr); } }
  .meta-item { background: var(--panel-2); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; }
  .meta-label { font-size: 9px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-family: var(--font-mono); }
  .meta-value { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
  .status-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; font-family: var(--font-mono); width: fit-content; }
  .status-badge.IN_PRODUCTION { background: var(--panel); color: var(--ink-2); border: 1px solid var(--border); }
  .status-badge.FAIL, .status-badge.SCRAP { background: var(--crit-soft); color: var(--crit-ink); }
  .status-badge.REWORK { background: var(--warn-soft); color: var(--warn-ink); }

  .table-wrap { overflow-x: auto; }
  table.insp-table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 11px; }
  table.insp-table thead th { text-align: left; font-family: var(--font-mono); font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; font-size: 9px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  table.insp-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--ink); }
  table.insp-table tbody tr:last-child td { border-bottom: none; }
  td.time { font-family: var(--font-mono); color: var(--ink-2); white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; font-family: var(--font-mono); }
  .badge.pass { background: var(--good-soft); color: var(--good-ink); }
  .badge.fail { background: var(--crit-soft); color: var(--crit-ink); }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-2); font-size: 12px; }
  .empty.error { color: var(--crit-ink); }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div>
      <h1>TV Sorgula</h1>
      <p class="lineage">Seri numarasını gir, o TV'nin hattını ve tüm kontrol geçmişini gör.</p>
    </div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Tema değiştir" aria-pressed="false">
      <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.5 12H2.1M21.9 12h-2.4M6 6l1.7 1.7M16.3 16.3 18 18M18 6l-1.7 1.7M7.7 16.3 6 18"/></svg>
      <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M20.8 14.4A8.5 8.5 0 1 1 9.6 3.2a7 7 0 0 0 11.2 11.2Z"/></svg>
    </button>
  </header>

  <form id="search-form" class="search-row">
    <input id="serial-input" type="text" placeholder="Örn. TLA018710QX0130001" autocomplete="off" autofocus />
    <button type="submit" class="search-btn" id="search-btn">Ara</button>
  </form>

  <div id="result"></div>

  <a class="back" href="/defect-dashboard">&larr; Hata Analizi Dashboard'una dön</a>
</div>

<script>
// ---- tema (gece/gündüz) değiştirici — tercih tüm QualiTV sayfalarında ortak saklanıyor ----
(function themeInit() {
  const root = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  const iconLight = document.getElementById("theme-icon-light");
  const iconDark = document.getElementById("theme-icon-dark");
  const saved = localStorage.getItem("qtv-theme");
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  function isDark() {
    const attr = root.getAttribute("data-theme");
    if (attr === "dark") return true;
    if (attr === "light") return false;
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function sync() {
    const dark = isDark();
    iconLight.style.display = dark ? "none" : "";
    iconDark.style.display = dark ? "" : "none";
    btn.setAttribute("aria-pressed", String(dark));
  }
  btn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("qtv-theme", next);
    sync();
  });
  sync();
})();

const form = document.getElementById("search-form");
const input = document.getElementById("serial-input");
const btn = document.getElementById("search-btn");
const resultEl = document.getElementById("result");

function statusLabel(status) {
  return { IN_PRODUCTION: "Üretimde", FAIL: "Hatalı", SCRAP: "Hurda", REWORK: "Yeniden İşlem" }[status] || status;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const serial = input.value.trim();
  if (!serial) return;

  btn.disabled = true;
  btn.textContent = "Aranıyor…";
  resultEl.innerHTML = '<div class="empty">Aranıyor…</div>';

  try {
    const res = await fetch(`/api/v1/tvs/${encodeURIComponent(serial)}/history`);
    if (res.status === 404) {
      resultEl.innerHTML = `<div class="empty error">"${serial}" seri numaralı bir TV bulunamadı.</div>`;
      return;
    }
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    render(data);
  } catch (err) {
    resultEl.innerHTML = `<div class="empty error">Sorgulanamadı: ${err.message}</div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = "Ara";
  }
});

function render(data) {
  const createdStr = new Date(data.created_at).toLocaleString("tr-TR", { dateStyle: "medium", timeStyle: "short" });

  const rowsHtml = data.inspections.length
    ? data.inspections.map(i => `
        <tr>
          <td class="time">${new Date(i.inspected_at).toLocaleString("tr-TR", { dateStyle: "medium", timeStyle: "short" })}</td>
          <td>${i.result === "PASS" ? '<span class="badge pass">OK</span>' : '<span class="badge fail">HATALI</span>'}</td>
          <td>${i.defect_category_name || "—"}</td>
          <td>${i.defect_reason || "—"}</td>
        </tr>
      `).join("")
    : `<tr><td colspan="4" style="text-align:center; color:var(--ink-2); padding:20px;">Bu TV için hiç kontrol kaydı yok.</td></tr>`;

  resultEl.innerHTML = `
    <section class="panel">
      <div class="tv-meta">
        <div class="meta-item"><div class="meta-label">Seri No</div><div class="meta-value">${data.serial_number}</div></div>
        <div class="meta-item"><div class="meta-label">Üretim Hattı</div><div class="meta-value">${data.line_code} — ${data.line_name}</div></div>
        <div class="meta-item"><div class="meta-label">Durum</div><div class="meta-value"><span class="status-badge ${data.status}">${statusLabel(data.status)}</span></div></div>
        <div class="meta-item"><div class="meta-label">Üretim Tarihi</div><div class="meta-value" style="font-size:11.5px;">${createdStr}</div></div>
      </div>
      <h2 style="margin-bottom:10px;">Kontrol Geçmişi <span class="panel-sub">(${data.inspections.length} kayıt)</span></h2>
      <div class="table-wrap">
        <table class="insp-table">
          <thead><tr><th>Tarih / Saat</th><th>Sonuç</th><th>Hata Türü</th><th>Ek Açıklama</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </section>
  `;
}
</script>
</body>
</html>
