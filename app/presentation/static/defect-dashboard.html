<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hata Analizi — QualiTV</title>
<style>
  :root {
    color-scheme: light;
    --bg:            #f5f6f8;
    --surface:       #ffffff;
    --ink:           #10161c;
    --ink-2:         #55606b;
    --ink-3:         #8b96a1;
    --border:        #dde2e6;
    --accent:        #2a78d6;
    --accent-soft:   #dce9fa;
    --accent-2:      #eb6834;
    --good:          #0ca30c;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "Consolas", monospace;
    --font-sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1013; --surface: #15191d; --ink: #f2f4f6; --ink-2: #aab2ba; --ink-3: #757e87;
      --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-soft: #17293f; --accent-2: #d95926;
      --good: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1013; --surface: #15191d; --ink: #f2f4f6; --ink-2: #aab2ba; --ink-3: #757e87;
    --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-soft: #17293f; --accent-2: #d95926;
    --good: #0ca30c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .page { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 28px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
  h1 { font-size: clamp(22px, 3vw, 30px); margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13.5px; }
  .live-dot { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--good); }
  .live-dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .kpi { background: var(--surface); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
  .kpi-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-family: var(--font-mono); }
  .kpi-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 600; }

  .tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px; width: fit-content; }
  .tab-btn { font: inherit; font-size: 13px; font-weight: 600; padding: 8px 16px; border-radius: 7px; border: none; background: transparent; color: var(--ink-2); cursor: pointer; }
  .tab-btn.active { background: var(--accent); color: #fff; }

  section.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px 24px 20px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 4px; }
  h2 { font-size: 15.5px; font-weight: 600; margin: 0; }
  .card-sub { font-size: 12.5px; color: var(--ink-2); }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); font-family: var(--font-mono); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .chart-scroll { overflow-x: auto; margin: 14px -4px 0; padding: 0 4px 6px; }

  .reason-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .reason-item { display: grid; grid-template-columns: 1fr 3fr 34px; align-items: center; gap: 12px; }
  .reason-text { font-size: 12.5px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reason-track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
  .reason-fill { width: 100%; height: 100%; background: var(--accent-2); border-radius: 5px; transform: scaleX(0); transform-origin: left; transition: transform .4s ease; }
  .reason-count { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-2); font-size: 13.5px; }
  .tooltip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.18); opacity: 0; transition: opacity .08s ease; z-index: 20; white-space: nowrap; }
  .tooltip.show { opacity: 1; }
  a.new-link { font-size: 13px; font-weight: 600; color: #fff; background: var(--accent); border-radius: 8px; padding: 9px 16px; text-decoration: none; white-space: nowrap; }
</style>
</head>
<body>
<div class="page">
  <header>
    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; flex-wrap:wrap;">
      <div>
        <p class="eyebrow">Kalite Kontrol &middot; Hata Analizi</p>
        <h1>Hata Analizi Dashboard'u</h1>
      </div>
      <a href="/inspections/new" class="new-link">+ Yeni Kontrol</a>
    </div>
    <div class="sub" style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <span>TV kontrol (OK/Hatalı) kayıtlarına dayanır — audit modülünden ayrı</span>
      <span class="live-dot"><i></i>Canlı veri</span>
    </div>
  </header>

  <div id="content"><div class="empty">Yükleniyor…</div></div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
const NS = "http://www.w3.org/2000/svg";
function elx(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
const tooltip = document.getElementById("tooltip");
function showTip(evt, html) { tooltip.innerHTML = html; tooltip.classList.add("show"); moveTip(evt); }
function moveTip(evt) {
  const x = evt.clientX, y = evt.clientY;
  tooltip.style.left = Math.min(x + 14, window.innerWidth - tooltip.offsetWidth - 12) + "px";
  tooltip.style.top = Math.max(y - 14, 8) + "px";
}
function hideTip() { tooltip.classList.remove("show"); }
window.addEventListener("mousemove", moveTip);

let dashboardData = null;
let activePeriod = "daily";

async function loadDashboard() {
  const content = document.getElementById("content");
  try {
    const res = await fetch("/api/v1/defect-dashboard/summary");
    if (!res.ok) throw new Error("HTTP " + res.status);
    dashboardData = await res.json();
    render();
  } catch (err) {
    content.innerHTML = `<div class="empty">Veri alınamadı: <b>${err.message}</b></div>`;
  }
}

function render() {
  const content = document.getElementById("content");
  const d = dashboardData;

  if (d.total_inspected === 0) {
    content.innerHTML = `<section class="card"><div class="empty">Henüz hiç kontrol kaydı yok.<br><a href="/inspections/new">İlk TV kontrolünü buradan gir</a> — burası otomatik dolmaya başlayacak.</div></section>`;
    return;
  }

  content.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Toplam Kontrol Edilen</div><div class="kpi-value">${d.total_inspected}</div></div>
      <div class="kpi"><div class="kpi-label">Toplam Hatalı</div><div class="kpi-value">${d.total_defective}</div></div>
      <div class="kpi"><div class="kpi-label">Genel Hata Oranı</div><div class="kpi-value">${d.overall_defect_rate}<small style="font-size:16px;color:var(--ink-2)">%</small></div></div>
    </div>

    <section class="card">
      <div class="card-head">
        <div><h2>Hata Oranı Trendi</h2><div class="card-sub">Dönem seç: günlük / haftalık / aylık</div></div>
        <div class="legend"><span><i style="background:var(--accent)"></i>Kontrol edilen</span><span><i style="background:var(--accent-2)"></i>Hatalı</span></div>
      </div>
      <div class="tabs" style="margin-top:10px;">
        <button class="tab-btn" data-period="daily">Günlük</button>
        <button class="tab-btn" data-period="weekly">Haftalık</button>
        <button class="tab-btn" data-period="monthly">Aylık</button>
      </div>
      <div class="chart-scroll"><svg id="chart-trend" role="img" aria-label="Hata oranı trendi"></svg></div>
    </section>

    <section class="card">
      <div class="card-head"><div><h2>En Sık Görülen Hata Nedenleri</h2><div class="card-sub">Manuel girilen hata açıklamalarına göre, en sık ilk 8</div></div></div>
      <div class="reason-list" id="reason-list"></div>
    </section>
  `;

  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.period === activePeriod);
    btn.addEventListener("click", () => {
      activePeriod = btn.dataset.period;
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b === btn));
      drawTrend();
    });
  });

  drawTrend();
  renderReasons();
}

function drawTrend() {
  const svg = document.getElementById("chart-trend");
  const data = dashboardData[activePeriod] || [];
  svg.innerHTML = "";

  if (!data.length) {
    svg.parentElement.innerHTML = '<div class="empty">Bu dönem için henüz veri yok.</div><svg id="chart-trend"></svg>';
    return;
  }

  const groupW = 34, gap = 10, padL = 42, padR = 16, padT = 14, padB = 34;
  const plotH = 200;
  const w = padL + data.length * (groupW + gap) + padR;
  const h = padT + plotH + padB;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);

  const maxV = Math.max(...data.map(d => d.inspected), 1) * 1.15;
  const y = v => padT + plotH - (v / maxV) * plotH;

  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const val = Math.round(maxV * t);
    const yy = y(val);
    svg.appendChild(elx("line", { x1: padL - 6, x2: w - padR, y1: yy, y2: yy, stroke: "var(--border)", "stroke-width": 1 }));
    const txt = elx("text", { x: padL - 10, y: yy + 3, "text-anchor": "end", "font-size": 9, fill: "var(--ink-3)", "font-family": "var(--font-mono)" });
    txt.textContent = val;
    svg.appendChild(txt);
  });

  data.forEach((d, i) => {
    const gx = padL + i * (groupW + gap);
    const barW = (groupW - 4) / 2;
    const rate = d.inspected ? (d.defective / d.inspected * 100).toFixed(1) : "0.0";

    const yA = y(d.inspected), hA = padT + plotH - yA;
    const rA = elx("rect", { x: gx, y: yA, width: barW, height: hA, rx: 2, fill: "var(--accent)" });
    const gA = elx("g");
    gA.appendChild(rA);
    gA.addEventListener("mousemove", e => showTip(e, `<b>${d.period}</b><br>Kontrol: <b>${d.inspected}</b><br>Hatalı: <b>${d.defective}</b><br>Oran: <b>${rate}%</b>`));
    gA.addEventListener("mouseleave", hideTip);
    svg.appendChild(gA);

    const yD = y(d.defective), hD = padT + plotH - yD;
    const rD = elx("rect", { x: gx + barW + 4, y: yD, width: barW, height: Math.max(hD, d.defective > 0 ? 2 : 0), rx: 2, fill: "var(--accent-2)" });
    const gD = elx("g");
    gD.appendChild(rD);
    gD.addEventListener("mousemove", e => showTip(e, `<b>${d.period}</b><br>Kontrol: <b>${d.inspected}</b><br>Hatalı: <b>${d.defective}</b><br>Oran: <b>${rate}%</b>`));
    gD.addEventListener("mouseleave", hideTip);
    svg.appendChild(gD);

    if (data.length <= 20 || i % 2 === 0) {
      const lbl = elx("text", { x: gx + groupW / 2, y: padT + plotH + 16, "text-anchor": "middle", "font-size": 8.5, fill: "var(--ink-3)", "font-family": "var(--font-mono)" });
      lbl.textContent = d.period.length > 10 ? d.period.slice(5) : d.period;
      svg.appendChild(lbl);
    }
  });
}

function renderReasons() {
  const list = document.getElementById("reason-list");
  const reasons = dashboardData.top_reasons;
  if (!reasons.length) {
    list.innerHTML = '<div class="empty">Henüz kayıtlı hata nedeni yok.</div>';
    return;
  }
  const maxCount = Math.max(...reasons.map(r => r.count));
  const fills = [];
  reasons.forEach(r => {
    const row = document.createElement("div");
    row.className = "reason-item";
    row.innerHTML = `
      <div class="reason-text" title="${r.reason}">${r.reason}</div>
      <div class="reason-track"><div class="reason-fill"></div></div>
      <div class="reason-count">${r.count}</div>
    `;
    list.appendChild(row);
    fills.push({ el: row.querySelector(".reason-fill"), pct: (r.count / maxCount) * 100 });
  });
  requestAnimationFrame(() => fills.forEach(f => { f.el.style.transform = `scaleX(${f.pct / 100})`; }));
}

loadDashboard();
</script>
</body>
</html>
