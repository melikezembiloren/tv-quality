<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hata Analizi — QualiTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg:            #e7e9eb;
    --panel:         #f7f8f9;
    --panel-2:       #eef0f1;
    --well:          #e1e4e6;
    --ink:           #14181b;
    --ink-2:         #4b545c;
    --ink-3:         #7c858c;
    --border:        #d1d6d9;
    --border-strong: #b3bac0;
    --good:        #1c8a4d;
    --good-ink:    #157a42;
    --good-soft:   #dbefe1;
    --warn:        #a8730a;
    --warn-ink:    #7a4c06;
    --warn-soft:   #f5e8cc;
    --warn-strong: #b0430f;
    --crit:        #c1272d;
    --crit-ink:    #c1272d;
    --crit-soft:   #f7dbdc;
    --focus:     #2f6fed;
    --selection-ink: #ffffff;
    --shadow-1: 0 1px 2px rgba(20,24,27,.06);
    --shadow-2: 0 8px 24px -8px rgba(20,24,27,.22);
    --shadow-well-inset: rgba(0,0,0,.18);
    --font-mono: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    --trend-good: #2563eb;
    --trend-bad:  #e11d48;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b0d0f; --panel: #16181b; --panel-2: #1c1f22; --well: #101214;
      --ink: #f1f2f3; --ink-2: #a7adb2; --ink-3: #767d82;
      --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.18);
      --good: #2fd274; --good-ink: var(--good); --good-soft: rgba(47,210,116,.16);
      --warn: #ffb648;  --warn-ink: var(--warn); --warn-soft: rgba(255,182,72,.16); --warn-strong: #ff8a3d;
      --crit: #ff5c5c;  --crit-ink: var(--crit); --crit-soft: rgba(255,92,92,.18);
      --focus: #6ea8ff;
      --selection-ink: var(--bg);
      --shadow-1: 0 1px 2px rgba(0,0,0,.4);
      --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
      --trend-good: #5b9dff;
      --trend-bad:  #ff5470;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0d0f; --panel: #16181b; --panel-2: #1c1f22; --well: #101214;
    --ink: #f1f2f3; --ink-2: #a7adb2; --ink-3: #767d82;
    --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.18);
    --good: #2fd274; --good-ink: var(--good); --good-soft: rgba(47,210,116,.16);
    --warn: #ffb648;  --warn-ink: var(--warn); --warn-soft: rgba(255,182,72,.16); --warn-strong: #ff8a3d;
    --crit: #ff5c5c;  --crit-ink: var(--crit); --crit-soft: rgba(255,92,92,.18);
    --focus: #6ea8ff;
    --selection-ink: var(--bg);
    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
    --trend-good: #5b9dff;
    --trend-bad:  #ff5470;
  }

  * { box-sizing: border-box; }
  html { scrollbar-color: var(--border-strong) transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background: var(--focus); color: var(--selection-ink); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid var(--bg); }

  .page { max-width: 1120px; margin: 0 auto; padding: 40px 24px 88px; display: flex; flex-direction: column; gap: 20px; }
  .masthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: clamp(19.5px, 2.64vw, 26.5px); margin: 0 0 6px; letter-spacing: -0.01em; font-weight: 400; }
  .lineage { color: var(--ink-2); font-size: 11.5px; margin: 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .live-chip {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .04em; color: var(--ink-3);
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 999px; background: var(--panel-2);
  }
  .live-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--good); display: inline-block; animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--ink-2);
    cursor: pointer; transition: border-color .15s ease, color .15s ease, transform .1s ease; flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; }

  .btn-primary {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--bg); background: var(--ink); border-radius: 8px;
    padding: 10px 16px; text-decoration: none; white-space: nowrap; border: 1px solid var(--ink);
    transition: opacity .15s ease, transform .1s ease;
  }
  .btn-primary:hover { opacity: .86; }
  .btn-primary:active { transform: scale(.97); }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; color: var(--ink-2); background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 15px; text-decoration: none; white-space: nowrap;
    transition: border-color .15s ease, color .15s ease;
  }
  .btn-ghost:hover { border-color: var(--border-strong); color: var(--ink); }
  .btn-ghost svg, .btn-primary svg { width: 15px; height: 15px; flex-shrink: 0; }

  /* ---- line filter pills ---- */
  .line-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
  .line-tab-btn {
    font: inherit; font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 9px 16px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--panel); color: var(--ink-2); cursor: pointer;
    white-space: nowrap; flex-shrink: 0; transition: border-color .15s ease, background-color .15s ease, color .15s ease;
  }
  .line-tab-btn.active { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .line-tab-btn:hover:not(.active) { border-color: var(--border-strong); color: var(--ink); }

  /* ---- date range toolbar ---- */
  .range-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; box-shadow: var(--shadow-1); }
  .range-toolbar .range-label { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 9.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); white-space: nowrap; }
  .range-toolbar .range-label svg { width: 14px; height: 14px; }
  .range-toolbar .range-sep { color: var(--ink-3); font-size: 11.5px; }
  .date-picker { font: inherit; font-size: 11.5px; color: var(--ink); background: var(--well); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; box-shadow: inset 0 1px 3px var(--shadow-well-inset); }
  .apply-btn { font: inherit; font-size: 11px; font-weight: 700; color: var(--bg); background: var(--ink); border: 1px solid var(--ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
  .apply-btn:hover { opacity: .86; }
  .clear-btn { font: inherit; font-size: 11px; font-weight: 600; color: var(--ink-3); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 4px; white-space: nowrap; }
  .clear-btn:hover { color: var(--ink); }

  /* ---- KPI counters (reused from quality-dashboard component language) ---- */
  .counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 620px) { .counters { grid-template-columns: 1fr; } }
  .counter { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 4px; box-shadow: var(--shadow-1); }
  .counter-well { background: var(--well); border-radius: 8px; padding: 16px 18px 14px; box-shadow: inset 0 1px 4px var(--shadow-well-inset); }
  .counter-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: clamp(23px, 2.99vw, 30px); letter-spacing: -0.01em; line-height: 1; }
  .counter-value small { font-size: 13px; color: var(--ink-2); font-weight: 500; }
  .counter-label { margin-top: 10px; font-size: 9px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3); font-weight: 600; }

  /* ---- panel card ---- */
  section.panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 22px 24px 20px; box-shadow: var(--shadow-1); }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 4px; }
  h2 { font-size: 10px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); }
  .panel-sub { font-size: 11px; color: var(--ink-3); font-family: var(--font-mono); }
  .legend { display: flex; gap: 16px; font-size: 10px; color: var(--ink-2); font-family: var(--font-mono); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 3px; border-radius: 1px; display: inline-block; }
  .chart-scroll { overflow-x: auto; margin: 14px -4px 0; padding: 0 4px 8px; }

  /* ---- period segmented control ---- */
  .tabs { display: flex; gap: 3px; background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px; padding: 3px; width: fit-content; margin-top: 10px; }
  .tab-btn { font: inherit; font-size: 10.5px; font-weight: 700; letter-spacing: .02em; padding: 7px 15px; border-radius: 8px; border: none; background: transparent; color: var(--ink-2); cursor: pointer; }
  .tab-btn.active { background: var(--ink); color: var(--bg); }

  /* ---- top-reasons ranked bars ---- */
  .reason-list { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .reason-item { display: grid; grid-template-columns: 1fr 3fr 34px; align-items: center; gap: 12px; }
  .reason-text { font-size: 11px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .reason-track { height: 10px; background: var(--well); border-radius: 999px; overflow: hidden; box-shadow: inset 0 1px 3px var(--shadow-well-inset); }
  .reason-fill { width: 100%; height: 100%; background: var(--warn); border-radius: 999px; transform: scaleX(0); transform-origin: left; transition: transform .4s ease; }
  .reason-count { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 11.5px; }

  /* ---- category pie(s) ---- */
  .pie-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 14px; }
  @media (max-width: 820px) { .pie-grid { grid-template-columns: 1fr; } }
  .pie-card { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .pie-card-title { font-size: 10px; font-weight: 700; color: var(--ink-2); font-family: var(--font-mono); text-transform: uppercase; letter-spacing: .04em; }
  .pie-legend { display: flex; flex-direction: column; gap: 6px; width: 100%; }
  .pie-legend-item { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 8px; font-size: 10px; }
  .pie-legend-item i { width: 10px; height: 10px; border-radius: 1px; display: inline-block; }
  .pie-legend-name { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pie-legend-count { color: var(--ink-2); font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  /* ---- record table ---- */
  .table-wrap { overflow-x: auto; margin-top: 14px; }
  table.insp-table { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 11px; }
  table.insp-table thead th { text-align: left; font-family: var(--font-mono); font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; font-size: 9px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
  table.insp-table tbody td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--ink); }
  table.insp-table tbody tr:last-child td { border-bottom: none; }
  td.serial { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  td.time { font-family: var(--font-mono); color: var(--ink-2); white-space: nowrap; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 9.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; font-family: var(--font-mono); }
  .badge.pass { background: var(--good-soft); color: var(--good-ink); }
  .badge.fail { background: var(--crit-soft); color: var(--crit-ink); }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-2); font-size: 12px; line-height: 1.7; }
  .empty a { color: var(--ink); font-weight: 700; text-decoration: underline; }
  .tooltip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 10.5px; line-height: 1.5; padding: 8px 10px; border-radius: 8px; box-shadow: var(--shadow-2); opacity: 0; transition: opacity .08s ease; z-index: 20; white-space: nowrap; }
  .tooltip.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .live-chip i { animation: none; }
    .reason-fill { transition: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div>
      <h1>Hata Analizi Dashboard'u</h1>
      <p class="lineage">
        <span>TV kontrol (OK/Hatalı) kayıtlarına dayanır</span>
        <span class="live-chip"><i></i>Canlı veri</span>
      </p>
    </div>
    <div class="header-actions">
      <a href="/tv-history" class="btn-ghost">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M19 19l-4.3-4.3"/></svg>
        TV Sorgula
      </a>
      <input type="month" class="date-picker" id="report-month-picker" title="Rapor ayı" />
      <a href="/api/v1/reports/monthly-summary-by-line" class="btn-ghost" target="_blank" rel="noopener" id="monthly-report-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h7l4 4V20a1 1 0 0 1-1 1h-10a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1Z"/><path d="M13.5 3.5V8h4"/><path d="M9 12.5h6M9 15.5h6M9 18.5h4"/></svg>
        Aylık Özet — Hat Bazlı (PDF)
      </a>
      <a href="/inspections/new?v=2" class="btn-primary">+ Yeni Kayıt</a>
      <button class="icon-btn" id="theme-toggle" type="button" aria-label="Tema değiştir" aria-pressed="false">
        <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.5 12H2.1M21.9 12h-2.4M6 6l1.7 1.7M16.3 16.3 18 18M18 6l-1.7 1.7M7.7 16.3 6 18"/></svg>
        <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M20.8 14.4A8.5 8.5 0 1 1 9.6 3.2a7 7 0 0 0 11.2 11.2Z"/></svg>
      </button>
    </div>
  </header>

  <div class="line-tabs" id="line-tabs"><div class="empty" style="padding:8px 0;">Hatlar yükleniyor…</div></div>

  <div class="range-toolbar" id="range-toolbar">
    <span class="range-label">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3v3.5M16 3v3.5"/></svg>
      Tarih Aralığı
    </span>
    <input type="date" class="date-picker" id="range-start" />
    <span class="range-sep">–</span>
    <input type="date" class="date-picker" id="range-end" title="Boş bırakırsan tek gün seçilmiş olur" />
    <button type="button" class="apply-btn" id="range-apply">Uygula</button>
    <button type="button" class="clear-btn" id="range-today">Bugüne dön</button>
  </div>

  <div id="content"><div class="empty">Yükleniyor…</div></div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
const NS = "http://www.w3.org/2000/svg";
function elx(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
const tooltip = document.getElementById("tooltip");
function showTip(evt, html) { tooltip.innerHTML = html; tooltip.classList.add("show"); moveTip(evt); }
function moveTip(evt) {
  const x = evt.clientX, y = evt.clientY;
  tooltip.style.left = Math.min(x + 14, window.innerWidth - tooltip.offsetWidth - 12) + "px";
  tooltip.style.top = Math.max(y - 14, 8) + "px";
}
function hideTip() { tooltip.classList.remove("show"); }
window.addEventListener("mousemove", moveTip);

// ---- tema (gece/gündüz) değiştirici — tercih tüm QualiTV sayfalarında ortak saklanıyor ----
(function themeInit() {
  const root = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  const iconLight = document.getElementById("theme-icon-light");
  const iconDark = document.getElementById("theme-icon-dark");
  const saved = localStorage.getItem("qtv-theme");
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  function isDark() {
    const attr = root.getAttribute("data-theme");
    if (attr === "dark") return true;
    if (attr === "light") return false;
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function sync() {
    const dark = isDark();
    iconLight.style.display = dark ? "none" : "";
    iconDark.style.display = dark ? "" : "none";
    btn.setAttribute("aria-pressed", String(dark));
  }
  btn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("qtv-theme", next);
    sync();
    // Donut dilimleri ve trend grafiğinin gradyanları çizim anında okunan sabit
    // hex renklerle oluşturuluyor (CSS değişkeni değil) — tema değişince ikisini
    // de yeniden çizdirmezsek eski temanın renklerinde takılı kalırlar.
    if (typeof dashboardData !== "undefined" && dashboardData) { renderPies(); drawTrend(); }
  });
  sync();
})();

let dashboardData = null;
let activePeriod = "daily";
let activeLineId = null; // null = Tüm Hatlar

function todayIso() { return new Date().toISOString().slice(0, 10); }
function fmtTr(iso) { const [y, m, d] = iso.split("-"); return `${d}.${m}.${y}`; }
function rangeLabel() {
  if (activeStartDate === activeEndDate) {
    return activeStartDate === todayIso() ? "Bugün" : fmtTr(activeStartDate);
  }
  return `${fmtTr(activeStartDate)} – ${fmtTr(activeEndDate)}`;
}

// Tüm grafikler ve listeler aynı tarih aralığını paylaşır — varsayılan "bugün"
// (tek gün); harita/takvimden iki tarih seçilirse arası, tek tarih seçilirse
// yine tek gün olarak yorumlanır.
let activeStartDate = todayIso();
let activeEndDate = todayIso();

// Aylık özet PDF'i için ay seçici — varsayılan bu ay, değiştirilince link güncellenir.
function initReportMonthPicker() {
  const monthInput = document.getElementById("report-month-picker");
  const link = document.getElementById("monthly-report-link");
  const now = new Date();
  const currentMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  monthInput.value = currentMonth;

  function updateLink() {
    const month = monthInput.value || currentMonth;
    link.href = `/api/v1/reports/monthly-summary-by-line?month=${month}`;
  }
  updateLink();
  monthInput.addEventListener("change", updateLink);
}

function initRangeToolbar() {
  const startInput = document.getElementById("range-start");
  const endInput = document.getElementById("range-end");
  startInput.value = activeStartDate;
  endInput.value = activeEndDate;

  document.getElementById("range-apply").addEventListener("click", () => {
    const s = startInput.value;
    const e = endInput.value;
    if (!s) { alert("En az bir tarih (Başlangıç) seçmelisin."); return; }
    activeStartDate = s;
    // Bitiş boşsa ya da başlangıçtan önceyse: tek gün seçilmiş sayılır.
    activeEndDate = (e && e >= s) ? e : s;
    endInput.value = activeEndDate;
    loadDashboard();
  });

  document.getElementById("range-today").addEventListener("click", () => {
    const t = todayIso();
    activeStartDate = t;
    activeEndDate = t;
    startInput.value = t;
    endInput.value = t;
    loadDashboard();
  });
}

async function loadLineTabs() {
  const wrap = document.getElementById("line-tabs");
  try {
    const res = await fetch("/api/v1/reference-data/production-lines");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const lines = await res.json();

    const tabs = [{ id: null, label: "Tüm Hatlar" }, ...lines.map(l => ({ id: l.id, label: `${l.code}` }))];
    wrap.innerHTML = tabs.map(t =>
      `<button type="button" class="line-tab-btn${t.id === activeLineId ? " active" : ""}" data-line-id="${t.id ?? ""}">${t.label}</button>`
    ).join("");

    wrap.querySelectorAll(".line-tab-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        activeLineId = btn.dataset.lineId ? Number(btn.dataset.lineId) : null;
        wrap.querySelectorAll(".line-tab-btn").forEach(b => b.classList.toggle("active", b === btn));
        loadDashboard();
      });
    });
  } catch (err) {
    wrap.innerHTML = `<div class="empty" style="padding:8px 0;">Hat listesi yüklenemedi: ${err.message}</div>`;
  }
}

// Hat filtresi + tarih aralığını (start_date/end_date) TÜM istekler için tutarlı
// şekilde ekler — grafikler, liste ve PDF indirme aynı parametreleri kullanır.
function withFilters(url) {
  const params = new URLSearchParams();
  if (activeLineId !== null) params.set("production_line_id", activeLineId);
  params.set("start_date", activeStartDate);
  params.set("end_date", activeEndDate);
  const sep = url.includes("?") ? "&" : "?";
  return `${url}${sep}${params.toString()}`;
}

async function loadDashboard() {
  const content = document.getElementById("content");
  content.innerHTML = '<div class="empty">Yükleniyor…</div>';
  try {
    const res = await fetch(withFilters("/api/v1/defect-dashboard/summary"));
    if (!res.ok) throw new Error("HTTP " + res.status);
    dashboardData = await res.json();
    render();
  } catch (err) {
    content.innerHTML = `<div class="empty">Veri alınamadı: <b>${err.message}</b></div>`;
  }
}

// Validated 8-slot kategorik palet (dataviz referans paleti) — sırası CVD-güvenli, karıştırma.
const CAT_PALETTE_LIGHT = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"];
const CAT_PALETTE_DARK  = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"];

function isDarkMode() {
  const explicit = document.documentElement.getAttribute("data-theme");
  if (explicit === "dark") return true;
  if (explicit === "light") return false;
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}

function foldToTop(slices, max = 8) {
  if (slices.length <= max) return slices;
  const top = slices.slice(0, max - 1);
  const otherCount = slices.slice(max - 1).reduce((s, x) => s + x.count, 0);
  return [...top, { category_name: "Diğer", count: otherCount }];
}

function polarToCartesian(cx, cy, r, angleDeg) {
  const rad = (angleDeg - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(rad), y: cy + r * Math.sin(rad) };
}

function describeDonutSlice(cx, cy, rOuter, rInner, startAngle, endAngle) {
  const span = endAngle - startAngle;
  // Tam tur (~360 derece, tek dilim %100 pay) icin baslangic/bitis noktalari
  // ayni yere denk gelir ve tek parcalik arc-path dejenere olup GORUNMEZ olur.
  // Bu yuzden tam turu ikiye bolup iki yarim halka olarak ciziyoruz.
  if (span >= 359.99) {
    const mid = startAngle + span / 2;
    return describeDonutSlice(cx, cy, rOuter, rInner, startAngle, mid)
      + " " + describeDonutSlice(cx, cy, rOuter, rInner, mid, endAngle);
  }
  const startOuter = polarToCartesian(cx, cy, rOuter, endAngle);
  const endOuter = polarToCartesian(cx, cy, rOuter, startAngle);
  const startInner = polarToCartesian(cx, cy, rInner, endAngle);
  const endInner = polarToCartesian(cx, cy, rInner, startAngle);
  const largeArc = span <= 180 ? 0 : 1;
  return [
    "M", startOuter.x, startOuter.y,
    "A", rOuter, rOuter, 0, largeArc, 0, endOuter.x, endOuter.y,
    "L", endInner.x, endInner.y,
    "A", rInner, rInner, 0, largeArc, 1, startInner.x, startInner.y,
    "Z",
  ].join(" ");
}

function drawPie(svgId, legendId, rawSlices, emptyLabel) {
  const svg = document.getElementById(svgId);
  const legend = document.getElementById(legendId);
  svg.innerHTML = "";
  legend.innerHTML = "";

  const total = rawSlices.reduce((s, x) => s + x.count, 0);
  if (!total) {
    legend.innerHTML = `<div class="empty" style="padding:8px 0;">${emptyLabel}</div>`;
    // bos daire (halka) - veri yok gorseli
    const cx = 75, cy = 75;
    svg.appendChild(elx("circle", { cx, cy, r: 60, fill: "none", stroke: "var(--border)", "stroke-width": 16 }));
    return;
  }

  const slices = foldToTop([...rawSlices].sort((a, b) => b.count - a.count));
  const palette = isDarkMode() ? CAT_PALETTE_DARK : CAT_PALETTE_LIGHT;
  const cx = 75, cy = 75, rOuter = 68, rInner = 40;

  let angle = 0;
  slices.forEach((s, i) => {
    const share = s.count / total;
    const startAngle = angle;
    const endAngle = angle + share * 360;
    angle = endAngle;
    const color = palette[i % palette.length];

    const path = elx("path", { d: describeDonutSlice(cx, cy, rOuter, rInner, startAngle, endAngle), fill: color });
    if (endAngle - startAngle < 359.99) {
      path.setAttribute("stroke", "var(--panel)");
      path.setAttribute("stroke-width", "2");
    }
    path.style.cursor = "pointer";
    path.addEventListener("mousemove", e => showTip(e, `<b>${s.category_name}</b><br>${s.count} kayıt (%${(share * 100).toFixed(0)})`));
    path.addEventListener("mouseleave", hideTip);
    svg.appendChild(path);

    const item = document.createElement("div");
    item.className = "pie-legend-item";
    item.innerHTML = `<i style="background:${color}"></i><span class="pie-legend-name" title="${s.category_name}">${s.category_name}</span><span class="pie-legend-count">${s.count}</span>`;
    legend.appendChild(item);
  });

  const centerLabel = elx("text", { x: cx, y: cy - 4, "text-anchor": "middle", "font-size": 20, "font-weight": 700, fill: "var(--ink)", "font-family": "var(--font-mono)" });
  centerLabel.textContent = total;
  svg.appendChild(centerLabel);
  const centerSub = elx("text", { x: cx, y: cy + 14, "text-anchor": "middle", "font-size": 9, fill: "var(--ink-3)", "font-family": "var(--font-mono)" });
  centerSub.textContent = "hatalı";
  svg.appendChild(centerSub);
}

function renderPies() {
  drawPie("pie-range", "pie-range-legend", dashboardData.category_breakdown_range, "Bu aralıkta hata yok");
}

async function loadDailyList() {
  const wrap = document.getElementById("daily-list-wrap");
  wrap.innerHTML = '<div class="empty">Yükleniyor…</div>';
  const isRange = activeStartDate !== activeEndDate;
  try {
    const res = await fetch(withFilters("/api/v1/inspections"));
    if (!res.ok) throw new Error("HTTP " + res.status);
    const rows = await res.json();

    if (!rows.length) {
      wrap.innerHTML = '<div class="empty">Bu tarih aralığında hiç kayıt yok.</div>';
      return;
    }

    const timeHeader = isRange ? "Tarih / Saat" : "Saat";
    const fmtTime = (iso) => isRange
      ? new Date(iso).toLocaleString("tr-TR", { dateStyle: "short", timeStyle: "short" })
      : new Date(iso).toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });

    wrap.innerHTML = `
      <table class="insp-table">
        <thead>
          <tr><th>${timeHeader}</th><th>TV Seri No</th><th>Sonuç</th><th>Hata Türü</th><th>Ek Açıklama</th></tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td class="time">${fmtTime(r.inspected_at)}</td>
              <td class="serial">${r.tv_serial_number}</td>
              <td>${r.result === "PASS" ? '<span class="badge pass">OK</span>' : '<span class="badge fail">HATALI</span>'}</td>
              <td>${r.defect_category_name || "—"}</td>
              <td>${r.defect_reason || "—"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  } catch (err) {
    wrap.innerHTML = `<div class="empty">Liste alınamadı: ${err.message}</div>`;
  }
}

function drawTrend() {
  const svg = document.getElementById("chart-trend");
  const data = dashboardData[activePeriod] || [];
  svg.innerHTML = "";

  if (!data.length) {
    svg.parentElement.innerHTML = '<div class="empty">Bu dönem için henüz veri yok.</div><svg id="chart-trend"></svg>';
    return;
  }

  const groupW = 34, gap = 10, padL = 42, padR = 16, padT = 14, padB = 52;
  const plotH = 200;
  const w = padL + data.length * (groupW + gap) + padR;
  const h = padT + plotH + padB;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);

  const styles = getComputedStyle(document.documentElement);
  const goodColor = styles.getPropertyValue("--trend-good").trim();
  const badColor = styles.getPropertyValue("--trend-bad").trim();
  const borderColor = styles.getPropertyValue("--border").trim();

  const defs = elx("defs", {});
  const gradA = elx("linearGradient", { id: "gradInspected", x1: "0", y1: "0", x2: "0", y2: "1" });
  gradA.appendChild(elx("stop", { offset: "0%", "stop-color": goodColor, "stop-opacity": "1" }));
  gradA.appendChild(elx("stop", { offset: "100%", "stop-color": goodColor, "stop-opacity": ".72" }));
  defs.appendChild(gradA);
  const gradD = elx("linearGradient", { id: "gradDefective", x1: "0", y1: "0", x2: "0", y2: "1" });
  gradD.appendChild(elx("stop", { offset: "0%", "stop-color": badColor, "stop-opacity": "1" }));
  gradD.appendChild(elx("stop", { offset: "100%", "stop-color": badColor, "stop-opacity": ".65" }));
  defs.appendChild(gradD);
  svg.appendChild(defs);

  const maxV = Math.max(...data.map(d => d.inspected), 1) * 1.15;
  const y = v => padT + plotH - (v / maxV) * plotH;

  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const val = Math.round(maxV * t);
    const yy = y(val);
    svg.appendChild(elx("line", { x1: padL - 6, x2: w - padR, y1: yy, y2: yy, stroke: borderColor, "stroke-width": 1 }));
    const txt = elx("text", { x: padL - 10, y: yy + 3, "text-anchor": "end", "font-size": 9, fill: "var(--ink-3)", "font-family": "var(--font-mono)" });
    txt.textContent = val;
    svg.appendChild(txt);
  });

  data.forEach((d, i) => {
    const gx = padL + i * (groupW + gap);
    const barW = (groupW - 4) / 2;
    const rate = d.inspected ? (d.defective / d.inspected * 100).toFixed(1) : "0.0";

    const yA = y(d.inspected), hA = padT + plotH - yA;
    const rA = elx("rect", { x: gx, y: yA, width: barW, height: hA, rx: 2, fill: "url(#gradInspected)" });
    const gA = elx("g", { style: "cursor:pointer" });
    gA.appendChild(rA);
    gA.addEventListener("mousemove", e => showTip(e, `<b>${d.period}</b><br>Kontrol: <b>${d.inspected}</b><br>Hatalı: <b>${d.defective}</b><br>Oran: <b>${rate}%</b>`));
    gA.addEventListener("mouseleave", hideTip);
    svg.appendChild(gA);

    const yD = y(d.defective), hD = padT + plotH - yD;
    const rD = elx("rect", { x: gx + barW + 4, y: yD, width: barW, height: Math.max(hD, d.defective > 0 ? 2 : 0), rx: 2, fill: "url(#gradDefective)" });
    const gD = elx("g", { style: "cursor:pointer" });
    gD.appendChild(rD);
    gD.addEventListener("mousemove", e => showTip(e, `<b>${d.period}</b><br>Kontrol: <b>${d.inspected}</b><br>Hatalı: <b>${d.defective}</b><br>Oran: <b>${rate}%</b>`));
    gD.addEventListener("mouseleave", hideTip);
    svg.appendChild(gD);

    if (data.length <= 20 || i % 2 === 0) {
      const lx = gx + groupW / 2, ly = padT + plotH + 14;
      const lbl = elx("text", {
        x: lx, y: ly, "text-anchor": "end", "font-size": 8.5, fill: "var(--ink-3)", "font-family": "var(--font-mono)",
        transform: `rotate(-40 ${lx} ${ly})`,
      });
      lbl.textContent = d.period;
      svg.appendChild(lbl);
    }
  });
}

function renderReasons() {
  const list = document.getElementById("reason-list");
  const reasons = dashboardData.top_reasons;
  if (!reasons.length) {
    list.innerHTML = '<div class="empty">Henüz kayıtlı hata nedeni yok.</div>';
    return;
  }
  const maxCount = Math.max(...reasons.map(r => r.count));
  const fills = [];
  reasons.forEach(r => {
    const row = document.createElement("div");
    row.className = "reason-item";
    row.innerHTML = `
      <div class="reason-text" title="${r.reason}">${r.reason}</div>
      <div class="reason-track"><div class="reason-fill"></div></div>
      <div class="reason-count">${r.count}</div>
    `;
    list.appendChild(row);
    fills.push({ el: row.querySelector(".reason-fill"), pct: (r.count / maxCount) * 100 });
  });
  requestAnimationFrame(() => fills.forEach(f => { f.el.style.transform = `scaleX(${f.pct / 100})`; }));
}

initReportMonthPicker();
initRangeToolbar();
loadLineTabs();
loadDashboard();
