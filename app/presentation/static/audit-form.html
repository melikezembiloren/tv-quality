<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Yeni Denetim — QualiTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg:            #e7e9eb;
    --panel:         #f7f8f9;
    --panel-2:       #eef0f1;
    --well:          #e1e4e6;
    --ink:           #14181b;
    --ink-2:         #4b545c;
    --ink-3:         #7c858c;
    --border:        #d1d6d9;
    --border-strong: #b3bac0;
    --good:        #1c8a4d;
    --good-ink:    #157a42;
    --good-soft:   #dbefe1;
    --warn:        #a8730a;
    --warn-ink:    #7a4c06;
    --warn-soft:   #f5e8cc;
    --warn-strong: #b0430f;
    --crit:        #c1272d;
    --crit-ink:    #c1272d;
    --crit-soft:   #f7dbdc;
    --focus:     #2f6fed;
    --selection-ink: #ffffff;
    --shadow-1: 0 1px 2px rgba(20,24,27,.06);
    --shadow-2: 0 8px 24px -8px rgba(20,24,27,.22);
    --shadow-well-inset: rgba(0,0,0,.18);
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "Consolas", monospace;
    --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b0d0f; --panel: #16181b; --panel-2: #1c1f22; --well: #101214;
      --ink: #f1f2f3; --ink-2: #a7adb2; --ink-3: #767d82;
      --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.18);
      --good: #2fd274; --good-ink: var(--good); --good-soft: rgba(47,210,116,.16);
      --warn: #ffb648;  --warn-ink: var(--warn); --warn-soft: rgba(255,182,72,.16); --warn-strong: #ff8a3d;
      --crit: #ff5c5c;  --crit-ink: var(--crit); --crit-soft: rgba(255,92,92,.18);
      --focus: #6ea8ff;
      --selection-ink: var(--bg);
      --shadow-1: 0 1px 2px rgba(0,0,0,.4);
      --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0d0f; --panel: #16181b; --panel-2: #1c1f22; --well: #101214;
    --ink: #f1f2f3; --ink-2: #a7adb2; --ink-3: #767d82;
    --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.18);
    --good: #2fd274; --good-ink: var(--good); --good-soft: rgba(47,210,116,.16);
    --warn: #ffb648;  --warn-ink: var(--warn); --warn-soft: rgba(255,182,72,.16); --warn-strong: #ff8a3d;
    --crit: #ff5c5c;  --crit-ink: var(--crit); --crit-soft: rgba(255,92,92,.18);
    --focus: #6ea8ff;
    --selection-ink: var(--bg);
    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { scrollbar-color: var(--border-strong) transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background: var(--focus); color: var(--selection-ink); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  ::-webkit-scrollbar { height: 10px; width: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; border: 2px solid var(--bg); }

  .page { max-width: 720px; margin: 0 auto; padding: 40px 24px 88px; display: flex; flex-direction: column; gap: 20px; }
  .masthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  h1 { font-size: clamp(19.5px, 2.64vw, 26.5px); margin: 0 0 6px; letter-spacing: -0.01em; font-weight: 400; }
  .lineage { color: var(--ink-2); font-size: 11.5px; max-width: 52ch; line-height: 1.5; margin: 0; }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--ink-2);
    cursor: pointer; transition: border-color .15s ease, color .15s ease, transform .1s ease; flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; }

  a.back { color: var(--ink-3); font-size: 11px; text-decoration: none; }
  a.back:hover { color: var(--ink); }

  form { display: flex; flex-direction: column; gap: 20px; }
  section.panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 24px 20px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 16px;
  }
  h2 { font-size: 10px; font-weight: 700; margin: 0; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-2); }
  .panel-sub { font-size: 11px; color: var(--ink-3); margin-top: -8px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .field .hint { font-size: 10px; color: var(--ink-3); font-family: var(--font-mono); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }

  input, select, textarea {
    font: inherit;
    font-size: 11.5px;
    color: var(--ink);
    background: var(--well);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    width: 100%;
    box-shadow: inset 0 1px 3px var(--shadow-well-inset);
  }
  input:focus, select:focus, textarea:focus {
    outline: 2px solid var(--focus);
    outline-offset: 1px;
    border-color: var(--focus);
  }
  textarea { resize: vertical; min-height: 44px; }

  .finding-row { display: grid; grid-template-columns: 1fr 150px 38px; gap: 10px; align-items: start; }
  @media (max-width: 560px) { .finding-row { grid-template-columns: 1fr; } }
  .finding-remove {
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--ink-2); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .finding-remove svg { width: 16px; height: 16px; }
  .finding-remove:hover { color: var(--crit); border-color: var(--crit); }
  .finding-remove:active { transform: scale(.94); }

  .add-finding {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 14px; cursor: pointer; transition: border-color .15s ease, color .15s ease;
  }
  .add-finding:hover { border-color: var(--border-strong); color: var(--ink); }

  .no-findings { font-size: 11.5px; color: var(--ink-3); }

  .btn-primary {
    font-size: 11.5px; font-weight: 600; color: var(--bg); background: var(--ink); border-radius: 8px;
    padding: 10px 16px; text-decoration: none; white-space: nowrap; border: 1px solid var(--ink);
    cursor: pointer; align-self: flex-start; transition: opacity .15s ease, transform .1s ease;
  }
  .btn-primary:hover { opacity: .86; }
  .btn-primary:active { transform: scale(.98); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .banner { border-radius: 12px; padding: 14px 18px; font-size: 11.5px; display: none; line-height: 1.5; }
  .banner.show { display: block; }
  .banner.success { background: var(--good-soft); border: 1px solid var(--good); color: var(--ink); }
  .banner.error { background: var(--crit-soft); border: 1px solid var(--crit); color: var(--ink); }
  .banner a { color: var(--ink); font-weight: 700; text-decoration: underline; }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div>
      <h1>Yeni Denetim Kaydı</h1>
      <p class="lineage">Bir hat için aylık denetim ve varsa bulgularını gir.</p>
    </div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Tema değiştir" aria-pressed="false">
      <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.5 12H2.1M21.9 12h-2.4M6 6l1.7 1.7M16.3 16.3 18 18M18 6l-1.7 1.7M7.7 16.3 6 18"/></svg>
      <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M20.8 14.4A8.5 8.5 0 1 1 9.6 3.2a7 7 0 0 0 11.2 11.2Z"/></svg>
    </button>
  </header>

  <div class="banner" id="banner"></div>

  <form id="audit-form">
    <section class="panel">
      <h2>Denetim Bilgileri</h2>
      <div class="row">
        <div class="field">
          <label for="line">Üretim Hattı</label>
          <select id="line" required><option value="">Yükleniyor…</option></select>
        </div>
        <div class="field">
          <label for="user">Denetimi Yapan</label>
          <select id="user" required><option value="">Yükleniyor…</option></select>
        </div>
      </div>
      <div class="field" style="max-width: 220px;">
        <label for="month">Denetim Ayı</label>
        <input type="month" id="month" required />
        <div class="hint">Örn. 2026-08</div>
      </div>
    </section>

    <section class="panel">
      <div>
        <h2>Bulgular</h2>
        <div class="panel-sub">Denetimde tespit edilen sorunlar (opsiyonel — hiç bulgu olmayabilir)</div>
      </div>
      <div id="findings-list"></div>
      <div id="no-findings" class="no-findings">Henüz bulgu eklenmedi.</div>
      <button type="button" class="add-finding" id="add-finding-btn">+ Bulgu Ekle</button>
    </section>

    <button type="submit" class="btn-primary" id="submit-btn">Denetimi Kaydet</button>
  </form>

  <a class="back" href="/quality-dashboard">&larr; Kalite Dashboard'a dön</a>
</div>

<template id="finding-template">
  <div class="finding-row" data-finding-row>
    <textarea placeholder="Bulgu açıklaması — örn. Hat sonu istasyonda etiketleme eksik" required data-desc></textarea>
    <select data-severity>
      <option value="LOW">Düşük</option>
      <option value="MEDIUM" selected>Orta</option>
      <option value="HIGH">Yüksek</option>
      <option value="CRITICAL">Kritik</option>
    </select>
    <button type="button" class="finding-remove" title="Bu bulguyu kaldır" data-remove>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
</template>

<script>
// ---- tema (gece/gündüz) değiştirici — tercih tüm QualiTV sayfalarında ortak saklanıyor ----
(function themeInit() {
  const root = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  const iconLight = document.getElementById("theme-icon-light");
  const iconDark = document.getElementById("theme-icon-dark");
  const saved = localStorage.getItem("qtv-theme");
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  function isDark() {
    const attr = root.getAttribute("data-theme");
    if (attr === "dark") return true;
    if (attr === "light") return false;
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function sync() {
    const dark = isDark();
    iconLight.style.display = dark ? "none" : "";
    iconDark.style.display = dark ? "" : "none";
    btn.setAttribute("aria-pressed", String(dark));
  }
  btn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("qtv-theme", next);
    sync();
  });
  sync();
})();

const lineSelect = document.getElementById("line");
const userSelect = document.getElementById("user");
const monthInput = document.getElementById("month");
const findingsList = document.getElementById("findings-list");
const noFindings = document.getElementById("no-findings");
const banner = document.getElementById("banner");
const submitBtn = document.getElementById("submit-btn");

// Ayı bugüne varsayılan olarak ayarla
const now = new Date();
monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;

async function loadReferenceData() {
  try {
    const res = await fetch("/api/v1/reference-data/audit-form");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();

    lineSelect.innerHTML = data.production_lines.length
      ? data.production_lines.map(l => `<option value="${l.id}">${l.code} — ${l.name}</option>`).join("")
      : `<option value="">Kayıtlı hat yok</option>`;

    userSelect.innerHTML = data.users.length
      ? data.users.map(u => `<option value="${u.id}">${u.full_name} (${u.username})</option>`).join("")
      : `<option value="">Kayıtlı kullanıcı yok</option>`;
  } catch (err) {
    showBanner("error", `Hat/kullanıcı listesi yüklenemedi: ${err.message}`);
  }
}

function addFindingRow() {
  const tpl = document.getElementById("finding-template");
  const node = tpl.content.cloneNode(true);
  node.querySelector("[data-remove]").addEventListener("click", (e) => {
    e.target.closest("[data-finding-row]").remove();
    toggleNoFindings();
  });
  findingsList.appendChild(node);
  toggleNoFindings();
}

function toggleNoFindings() {
  noFindings.style.display = findingsList.children.length ? "none" : "block";
}

document.getElementById("add-finding-btn").addEventListener("click", addFindingRow);
toggleNoFindings();

function showBanner(type, html) {
  banner.className = `banner show ${type}`;
  banner.innerHTML = html;
}

document.getElementById("audit-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  banner.className = "banner";

  const findings = [...findingsList.querySelectorAll("[data-finding-row]")].map(row => ({
    description: row.querySelector("[data-desc]").value.trim(),
    severity: row.querySelector("[data-severity]").value,
  })).filter(f => f.description.length > 0);

  const payload = {
    production_line_id: Number(lineSelect.value),
    audited_by_user_id: Number(userSelect.value),
    audit_month: monthInput.value, // <input type="month"> zaten "YYYY-MM" verir
    findings,
  };

  submitBtn.disabled = true;
  submitBtn.textContent = "Kaydediliyor…";

  try {
    const res = await fetch("/api/v1/audits", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const body = await res.json();

    if (!res.ok) {
      throw new Error(body.detail || "Kayıt başarısız");
    }

    showBanner("success", `Denetim kaydedildi (#${body.id}, ${body.findings.length} bulgu). <a href="/quality-dashboard">Dashboard'da gör &rarr;</a>`);
    findingsList.innerHTML = "";
    toggleNoFindings();
    document.getElementById("audit-form").reset();
    monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
  } catch (err) {
    showBanner("error", `Kaydedilemedi: ${err.message}`);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Denetimi Kaydet";
  }
});

loadReferenceData();
</script>
</body>
</html>
