<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kalite Kontrol — QualiTV</title>
<style>
  :root {
    color-scheme: light;
    --bg:            #f5f6f8;
    --surface:       #ffffff;
    --ink:           #10161c;
    --ink-2:         #55606b;
    --ink-3:         #8b96a1;
    --border:        #dde2e6;
    --accent:        #2a78d6;
    --accent-soft:   #dce9fa;
    --good:          #0ca30c;
    --good-soft:     #d9f3d9;
    --critical:      #d03b3b;
    --critical-soft: #fbdddd;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "Consolas", monospace;
    --font-sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1013; --surface: #15191d; --ink: #f2f4f6; --ink-2: #aab2ba; --ink-3: #757e87;
      --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-soft: #17293f;
      --good: #0ca30c; --good-soft: #123a17; --critical: #e66767; --critical-soft: #3a1517;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1013; --surface: #15191d; --ink: #f2f4f6; --ink-2: #aab2ba; --ink-3: #757e87;
    --border: rgba(255,255,255,0.10); --accent: #3987e5; --accent-soft: #17293f;
    --good: #0ca30c; --good-soft: #123a17; --critical: #e66767; --critical-soft: #3a1517;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .page { max-width: 560px; margin: 0 auto; padding: 32px 20px 80px; display: flex; flex-direction: column; gap: 20px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 6px; }
  h1 { font-size: clamp(22px, 4vw, 26px); margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13px; }
  a.back { color: var(--ink-2); font-size: 12.5px; text-decoration: none; }
  a.back:hover { color: var(--accent); }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--ink-2);
    cursor: pointer; transition: border-color .15s ease, color .15s ease, transform .1s ease; flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; }

  input, select, textarea {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 14px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 60px; }

  .result-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .result-btn {
    font: inherit; font-size: 16px; font-weight: 700; padding: 20px 12px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--surface); color: var(--ink-2); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .result-btn .icon { font-size: 26px; }
  .result-btn.pass.active { border-color: var(--good); background: var(--good-soft); color: var(--good); }
  .result-btn.fail.active { border-color: var(--critical); background: var(--critical-soft); color: var(--critical); }

  #fail-fields { display: none; flex-direction: column; gap: 16px; }
  #fail-fields.show { display: flex; }

  .add-category-link {
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--accent);
    background: none; border: none; cursor: pointer; padding: 0;
  }
  .add-category-row { display: none; gap: 8px; }
  .add-category-row.show { display: flex; }
  .add-category-row input { flex: 1; }
  .add-category-row button {
    font: inherit; font-size: 13px; font-weight: 700; color: #fff; background: var(--accent);
    border: none; border-radius: 10px; padding: 0 16px; cursor: pointer; white-space: nowrap;
  }

  button.submit {
    font: inherit; font-size: 16px; font-weight: 700; color: #fff;
    background: var(--accent); border: none; border-radius: 12px;
    padding: 16px 20px; cursor: pointer;
  }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .banner { border-radius: 10px; padding: 14px 18px; font-size: 13.5px; display: none; }
  .banner.show { display: block; }
  .banner.success { background: color-mix(in srgb, var(--good) 14%, var(--surface)); border: 1px solid var(--good); color: var(--ink); }
  .banner.error { background: color-mix(in srgb, var(--critical) 14%, var(--surface)); border: 1px solid var(--critical); color: var(--ink); }
</style>
</head>
<body>
<div class="page">
  <header style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px;">
    <div>
      <p class="eyebrow">Kalite Kontrol</p>
      <h1>TV Kontrolü</h1>
      <div class="sub">Üretim hattından bağımsız — her TV için OK / Hatalı işaretle</div>
    </div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Tema değiştir" aria-pressed="false">
      <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.5 12H2.1M21.9 12h-2.4M6 6l1.7 1.7M16.3 16.3 18 18M18 6l-1.7 1.7M7.7 16.3 6 18"/></svg>
      <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M20.8 14.4A8.5 8.5 0 1 1 9.6 3.2a7 7 0 0 0 11.2 11.2Z"/></svg>
    </button>
  </header>

  <div class="banner" id="banner"></div>

  <form id="insp-form">
    <div class="card">
      <div class="field">
        <label for="serial">Seri Numarası</label>
        <input id="serial" type="text" placeholder="örn. TZ55-00042" required autofocus />
      </div>
      <div class="field">
        <label for="line">İnç / Hat</label>
        <select id="line" required><option value="">Yükleniyor…</option></select>
      </div>
    </div>

    <div class="card">
      <div class="field">
        <label>Sonuç</label>
        <div class="result-toggle">
          <button type="button" class="result-btn pass" data-result="PASS"><span class="icon">✓</span>OK</button>
          <button type="button" class="result-btn fail" data-result="FAIL"><span class="icon">✕</span>Hatalı</button>
        </div>
      </div>

      <div id="fail-fields">
        <div class="field">
          <div class="field-head">
            <label for="category">Hata Türü</label>
            <button type="button" class="add-category-link" id="add-category-toggle">+ Yeni hata türü ekle</button>
          </div>
          <select id="category"><option value="">Yükleniyor…</option></select>
          <div class="add-category-row" id="add-category-row">
            <input id="new-category-name" type="text" placeholder="Yeni hata türü adı" />
            <button type="button" id="add-category-btn">Ekle</button>
          </div>
        </div>
        <div class="field">
          <label for="note">Ek Açıklama <span style="font-weight:400;">(opsiyonel)</span></label>
          <textarea id="note" placeholder="İstersen ek detay yaz"></textarea>
        </div>
      </div>
    </div>

    <button type="submit" class="submit" id="submit-btn">Kaydet</button>
  </form>

  <a class="back" href="/defect-dashboard">&rarr; Hata Analizi Dashboard'unu gör</a>
</div>

<script>
// ---- tema (gece/gündüz) değiştirici — tercih tüm QualiTV sayfalarında ortak saklanıyor ----
(function themeInit() {
  const root = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  const iconLight = document.getElementById("theme-icon-light");
  const iconDark = document.getElementById("theme-icon-dark");
  const saved = localStorage.getItem("qtv-theme");
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  function isDark() {
    const attr = root.getAttribute("data-theme");
    if (attr === "dark") return true;
    if (attr === "light") return false;
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function sync() {
    const dark = isDark();
    iconLight.style.display = dark ? "none" : "";
    iconDark.style.display = dark ? "" : "none";
    btn.setAttribute("aria-pressed", String(dark));
  }
  btn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("qtv-theme", next);
    sync();
  });
  sync();
})();

const lineSelect = document.getElementById("line");
const categorySelect = document.getElementById("category");
const serialInput = document.getElementById("serial");
const failFields = document.getElementById("fail-fields");
const noteInput = document.getElementById("note");
const banner = document.getElementById("banner");
const submitBtn = document.getElementById("submit-btn");
const resultBtns = document.querySelectorAll(".result-btn");
const addCategoryToggle = document.getElementById("add-category-toggle");
const addCategoryRow = document.getElementById("add-category-row");
const newCategoryName = document.getElementById("new-category-name");
const addCategoryBtn = document.getElementById("add-category-btn");
let selectedResult = null;

async function loadLines() {
  try {
    const res = await fetch("/api/v1/reference-data/audit-form");
    const data = await res.json();
    lineSelect.innerHTML = data.production_lines.length
      ? data.production_lines.map(l => `<option value="${l.id}">${l.code} — ${l.name}</option>`).join("")
      : `<option value="">Kayıtlı hat yok</option>`;
  } catch (err) {
    showBanner("error", `Hat listesi yüklenemedi: ${err.message}`);
  }
}

async function loadCategories(selectId = null) {
  try {
    const res = await fetch("/api/v1/defect-categories");
    const data = await res.json();
    categorySelect.innerHTML = data.length
      ? data.map(c => `<option value="${c.id}">${c.name}</option>`).join("")
      : `<option value="">Henüz hata türü yok — ekleyin</option>`;
    if (selectId) categorySelect.value = String(selectId);
  } catch (err) {
    showBanner("error", `Hata türü listesi yüklenemedi: ${err.message}`);
  }
}

resultBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    resultBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedResult = btn.dataset.result;
    if (selectedResult === "FAIL") {
      failFields.classList.add("show");
      categorySelect.required = true;
    } else {
      failFields.classList.remove("show");
      categorySelect.required = false;
      categorySelect.value = "";
      noteInput.value = "";
      addCategoryRow.classList.remove("show");
    }
  });
});

addCategoryToggle.addEventListener("click", () => {
  addCategoryRow.classList.toggle("show");
  if (addCategoryRow.classList.contains("show")) newCategoryName.focus();
});

addCategoryBtn.addEventListener("click", async () => {
  const name = newCategoryName.value.trim();
  if (!name) return;
  addCategoryBtn.disabled = true;
  try {
    const res = await fetch("/api/v1/defect-categories", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || "Eklenemedi");
    await loadCategories(body.id);
    newCategoryName.value = "";
    addCategoryRow.classList.remove("show");
  } catch (err) {
    showBanner("error", `Hata türü eklenemedi: ${err.message}`);
  } finally {
    addCategoryBtn.disabled = false;
  }
});

function showBanner(type, html) {
  banner.className = `banner show ${type}`;
  banner.innerHTML = html;
}

function resetForm() {
  document.getElementById("insp-form").reset();
  resultBtns.forEach(b => b.classList.remove("active"));
  selectedResult = null;
  failFields.classList.remove("show");
  addCategoryRow.classList.remove("show");
  serialInput.focus();
}

document.getElementById("insp-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  banner.className = "banner";

  if (!selectedResult) {
    showBanner("error", "Önce OK ya da Hatalı seç.");
    return;
  }
  if (selectedResult === "FAIL" && !categorySelect.value) {
    showBanner("error", "Hatalı için bir hata türü seç.");
    return;
  }

  const payload = {
    serial_number: serialInput.value.trim(),
    production_line_id: Number(lineSelect.value),
    result: selectedResult,
    defect_category_id: selectedResult === "FAIL" ? Number(categorySelect.value) : null,
    defect_reason: selectedResult === "FAIL" ? (noteInput.value.trim() || null) : null,
  };

  submitBtn.disabled = true;
  submitBtn.textContent = "Kaydediliyor…";

  try {
    const res = await fetch("/api/v1/inspections", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || "Kayıt başarısız");

    showBanner("success", `Kaydedildi — TV #${body.tv_id}, sonuç: <b>${body.result}</b> (TV durumu: ${body.tv_status})`);
    resetForm();
  } catch (err) {
    showBanner("error", `Kaydedilemedi: ${err.message}`);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Kaydet";
  }
});

loadLines();
loadCategories();
</script>
</body>
</html>
