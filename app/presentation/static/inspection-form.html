<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kalite Kontrol — QualiTV</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light;
    --bg:            #e7e9eb;
    --panel:         #f7f8f9;
    --panel-2:       #eef0f1;
    --well:          #e1e4e6;
    --ink:           #14181b;
    --ink-2:         #4b545c;
    --ink-3:         #7c858c;
    --border:        #d1d6d9;
    --border-strong: #b3bac0;
    --good:        #1c8a4d;
    --good-ink:    #157a42;
    --good-soft:   #dbefe1;
    --warn:        #a8730a;
    --warn-ink:    #7a4c06;
    --warn-soft:   #f5e8cc;
    --warn-strong: #b0430f;
    --crit:        #c1272d;
    --crit-ink:    #c1272d;
    --crit-soft:   #f7dbdc;
    --focus:     #2f6fed;
    --selection-ink: #ffffff;
    --shadow-1: 0 1px 2px rgba(20,24,27,.06);
    --shadow-2: 0 8px 24px -8px rgba(20,24,27,.22);
    --shadow-well-inset: rgba(0,0,0,.18);
    --font-mono: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b0d0f; --panel: #16181b; --panel-2: #1c1f22; --well: #101214;
      --ink: #f1f2f3; --ink-2: #a7adb2; --ink-3: #767d82;
      --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.18);
      --good: #2fd274; --good-ink: var(--good); --good-soft: rgba(47,210,116,.16);
      --warn: #ffb648;  --warn-ink: var(--warn); --warn-soft: rgba(255,182,72,.16); --warn-strong: #ff8a3d;
      --crit: #ff5c5c;  --crit-ink: var(--crit); --crit-soft: rgba(255,92,92,.18);
      --focus: #6ea8ff;
      --selection-ink: var(--bg);
      --shadow-1: 0 1px 2px rgba(0,0,0,.4);
      --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0d0f; --panel: #16181b; --panel-2: #1c1f22; --well: #101214;
    --ink: #f1f2f3; --ink-2: #a7adb2; --ink-3: #767d82;
    --border: rgba(255,255,255,.08); --border-strong: rgba(255,255,255,.18);
    --good: #2fd274; --good-ink: var(--good); --good-soft: rgba(47,210,116,.16);
    --warn: #ffb648;  --warn-ink: var(--warn); --warn-soft: rgba(255,182,72,.16); --warn-strong: #ff8a3d;
    --crit: #ff5c5c;  --crit-ink: var(--crit); --crit-soft: rgba(255,92,92,.18);
    --focus: #6ea8ff;
    --selection-ink: var(--bg);
    --shadow-1: 0 1px 2px rgba(0,0,0,.4);
    --shadow-2: 0 12px 32px -8px rgba(0,0,0,.6);
  }

  * { box-sizing: border-box; }
  html { scrollbar-color: var(--border-strong) transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  ::selection { background: var(--focus); color: var(--selection-ink); }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .page { max-width: 560px; margin: 0 auto; padding: 32px 20px 88px; display: flex; flex-direction: column; gap: 20px; }
  .masthead { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  h1 { font-size: clamp(19.5px, 3.52vw, 26.5px); margin: 0 0 4px; letter-spacing: -0.01em; font-weight: 400; }
  .lineage { color: var(--ink-2); font-size: 11.5px; margin: 0; }
  a.back { color: var(--ink-3); font-size: 11px; text-decoration: none; }
  a.back:hover { color: var(--ink); }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px;
    border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--ink-2);
    cursor: pointer; transition: border-color .15s ease, color .15s ease, transform .1s ease; flex-shrink: 0;
  }
  .icon-btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .icon-btn:active { transform: scale(.94); }
  .icon-btn svg { width: 18px; height: 18px; }

  section.panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; box-shadow: var(--shadow-1); display: flex; flex-direction: column; gap: 16px;
  }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; }

  /* Saha girişi: dokunmatik hedefler büyük, 16px giriş boyutu mobil tarayıcıda
     odaklanınca otomatik yakınlaştırmayı önler (iOS Safari eşiği) — bilinçli sapma. */
  input, select, textarea {
    font: inherit; font-size: 16px; color: var(--ink); background: var(--well);
    border: 1px solid var(--border); border-radius: 8px; padding: 14px 14px; width: 100%;
    box-shadow: inset 0 1px 3px var(--shadow-well-inset);
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--focus); outline-offset: 1px; border-color: var(--focus); }
  textarea { resize: vertical; min-height: 60px; }

  .result-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .result-btn {
    font: inherit; font-size: 13px; font-weight: 700; padding: 20px 12px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--well); color: var(--ink-2); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    transition: border-color .15s ease, background-color .15s ease, color .15s ease;
  }
  .result-btn svg { width: 26px; height: 26px; }
  .result-btn.pass.active { border-color: var(--good); background: var(--good-soft); color: var(--good-ink); }
  .result-btn.fail.active { border-color: var(--crit); background: var(--crit-soft); color: var(--crit-ink); }

  #fail-fields { display: none; flex-direction: column; gap: 16px; }
  #fail-fields.show { display: flex; }

  .add-category-link {
    font: inherit; font-size: 11px; font-weight: 700; color: var(--ink-2);
    background: none; border: none; cursor: pointer; padding: 0; text-decoration: underline;
  }
  .add-category-link:hover { color: var(--ink); }
  .add-category-row { display: none; gap: 8px; }
  .add-category-row.show { display: flex; }
  .add-category-row input { flex: 1; }
  .add-category-row button {
    font: inherit; font-size: 11.5px; font-weight: 700; color: var(--bg); background: var(--ink);
    border: 1px solid var(--ink); border-radius: 8px; padding: 0 16px; cursor: pointer; white-space: nowrap;
  }

  /* ---- birden fazla hata satırı (audit-form'daki bulgu listesiyle aynı desen) ---- */
  .defects-list { display: flex; flex-direction: column; gap: 10px; }
  .defect-row { display: grid; grid-template-columns: 1fr 1fr 38px; gap: 8px; align-items: start; }
  @media (max-width: 460px) { .defect-row { grid-template-columns: 1fr; } }
  .defect-remove {
    width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel); color: var(--ink-2); cursor: pointer; padding: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: border-color .15s ease, color .15s ease, transform .1s ease;
  }
  .defect-remove svg { width: 15px; height: 15px; }
  .defect-remove:hover { color: var(--crit); border-color: var(--crit); }
  .defect-remove:active { transform: scale(.94); }

  .add-defect-btn {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-2);
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 14px; cursor: pointer; transition: border-color .15s ease, color .15s ease; width: auto;
  }
  .add-defect-btn:hover { border-color: var(--border-strong); color: var(--ink); }
  .no-defects { font-size: 11.5px; color: var(--ink-3); }

  button.submit {
    font: inherit; font-size: 13px; font-weight: 700; color: var(--bg);
    background: var(--ink); border: 1px solid var(--ink); border-radius: 12px;
    padding: 16px 20px; cursor: pointer; transition: opacity .15s ease, transform .1s ease;
  }
  button.submit:hover { opacity: .88; }
  button.submit:active { transform: scale(.99); }
  button.submit:disabled { opacity: 0.5; cursor: not-allowed; }

  .banner { border-radius: 12px; padding: 14px 18px; font-size: 11.5px; display: none; line-height: 1.5; }
  .banner.show { display: block; }
  .banner.success { background: var(--good-soft); border: 1px solid var(--good); color: var(--ink); }
  .banner.error { background: var(--crit-soft); border: 1px solid var(--crit); color: var(--ink); }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <div>
      <h1>TV Kontrolü</h1>
      <p class="lineage">Üretim hattından bağımsız — her TV için OK / Hatalı işaretle</p>
    </div>
    <button class="icon-btn" id="theme-toggle" type="button" aria-label="Tema değiştir" aria-pressed="false">
      <svg id="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.5 12H2.1M21.9 12h-2.4M6 6l1.7 1.7M16.3 16.3 18 18M18 6l-1.7 1.7M7.7 16.3 6 18"/></svg>
      <svg id="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M20.8 14.4A8.5 8.5 0 1 1 9.6 3.2a7 7 0 0 0 11.2 11.2Z"/></svg>
    </button>
  </header>

  <div class="banner" id="banner"></div>

  <form id="insp-form">
    <section class="panel">
      <div class="field">
        <label for="serial">Seri Numarası</label>
        <input id="serial" type="text" placeholder="örn. TZ55-00042" required autofocus />
      </div>
      <div class="field">
        <label for="line">İnç / Hat</label>
        <select id="line" required><option value="">Yükleniyor…</option></select>
      </div>
    </section>

    <section class="panel">
      <div class="field">
        <label>Sonuç</label>
        <div class="result-toggle">
          <button type="button" class="result-btn pass" data-result="PASS">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
            OK
          </button>
          <button type="button" class="result-btn fail" data-result="FAIL">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
            Hatalı
          </button>
        </div>
      </div>

      <div id="fail-fields">
        <div class="field">
          <div class="field-head">
            <label>Hatalar <span style="font-weight:400; text-transform:none; letter-spacing:0;">(birden fazla eklenebilir)</span></label>
            <button type="button" class="add-category-link" id="add-category-toggle">+ Yeni hata türü ekle</button>
          </div>
          <div class="add-category-row" id="add-category-row">
            <input id="new-category-name" type="text" placeholder="Yeni hata türü adı" />
            <button type="button" id="add-category-btn">Ekle</button>
          </div>
          <div class="defects-list" id="defects-list"></div>
          <div id="no-defects" class="no-defects">Henüz hata eklenmedi.</div>
          <button type="button" class="add-defect-btn" id="add-defect-btn">+ Hata Ekle</button>
        </div>
      </div>
    </section>

    <button type="submit" class="submit" id="submit-btn">Kaydet</button>
  </form>

  <a class="back" href="/defect-dashboard">&rarr; Hata Analizi Dashboard'unu gör</a>
</div>

<template id="defect-template">
  <div class="defect-row" data-defect-row>
    <select data-defect-category required></select>
    <input type="text" placeholder="Ek açıklama (opsiyonel)" data-defect-note />
    <button type="button" class="defect-remove" title="Bu hatayı kaldır" data-remove>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
    </button>
  </div>
</template>

<script>
// ---- tema (gece/gündüz) değiştirici — tercih tüm QualiTV sayfalarında ortak saklanıyor ----
(function themeInit() {
  const root = document.documentElement;
  const btn = document.getElementById("theme-toggle");
  const iconLight = document.getElementById("theme-icon-light");
  const iconDark = document.getElementById("theme-icon-dark");
  const saved = localStorage.getItem("qtv-theme");
  if (saved === "dark" || saved === "light") root.setAttribute("data-theme", saved);
  function isDark() {
    const attr = root.getAttribute("data-theme");
    if (attr === "dark") return true;
    if (attr === "light") return false;
    return window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function sync() {
    const dark = isDark();
    iconLight.style.display = dark ? "none" : "";
    iconDark.style.display = dark ? "" : "none";
    btn.setAttribute("aria-pressed", String(dark));
  }
  btn.addEventListener("click", () => {
    const next = isDark() ? "light" : "dark";
    root.setAttribute("data-theme", next);
    localStorage.setItem("qtv-theme", next);
    sync();
  });
  sync();
})();

const lineSelect = document.getElementById("line");
const serialInput = document.getElementById("serial");
const failFields = document.getElementById("fail-fields");
const banner = document.getElementById("banner");
const submitBtn = document.getElementById("submit-btn");
const resultBtns = document.querySelectorAll(".result-btn");
const addCategoryToggle = document.getElementById("add-category-toggle");
const addCategoryRow = document.getElementById("add-category-row");
const newCategoryName = document.getElementById("new-category-name");
const addCategoryBtn = document.getElementById("add-category-btn");
const defectsList = document.getElementById("defects-list");
const noDefects = document.getElementById("no-defects");
const addDefectBtn = document.getElementById("add-defect-btn");
const defectTemplate = document.getElementById("defect-template");
let selectedResult = null;
let allCategories = []; // { id, name } — tüm satırların dropdown'ları buradan besleniyor

async function loadLines() {
  try {
    const res = await fetch("/api/v1/reference-data/audit-form");
    const data = await res.json();
    lineSelect.innerHTML = data.production_lines.length
      ? data.production_lines.map(l => `<option value="${l.id}">${l.code} — ${l.name}</option>`).join("")
      : `<option value="">Kayıtlı hat yok</option>`;
  } catch (err) {
    showBanner("error", `Hat listesi yüklenemedi: ${err.message}`);
  }
}

function categoryOptionsHtml() {
  return allCategories.length
    ? allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join("")
    : `<option value="">Henüz hata türü yok — ekleyin</option>`;
}

async function loadCategories(preselectId = null) {
  try {
    const res = await fetch("/api/v1/defect-categories");
    allCategories = await res.json();
    // mevcut tüm satırların dropdown'larını da güncel listeyle tazele
    defectsList.querySelectorAll("[data-defect-category]").forEach(sel => {
      const current = sel.value;
      sel.innerHTML = categoryOptionsHtml();
      if (current) sel.value = current;
    });
    if (preselectId) addDefectRow(preselectId);
  } catch (err) {
    showBanner("error", `Hata türü listesi yüklenemedi: ${err.message}`);
  }
}

function toggleNoDefects() {
  noDefects.style.display = defectsList.children.length ? "none" : "block";
}

function addDefectRow(preselectId = null) {
  const node = defectTemplate.content.cloneNode(true);
  const select = node.querySelector("[data-defect-category]");
  select.innerHTML = categoryOptionsHtml();
  if (preselectId) select.value = String(preselectId);
  node.querySelector("[data-remove]").addEventListener("click", (e) => {
    e.target.closest("[data-defect-row]").remove();
    toggleNoDefects();
  });
  defectsList.appendChild(node);
  toggleNoDefects();
}

addDefectBtn.addEventListener("click", () => addDefectRow());

resultBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    resultBtns.forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    selectedResult = btn.dataset.result;
    if (selectedResult === "FAIL") {
      failFields.classList.add("show");
      if (!defectsList.children.length) addDefectRow(); // ilk seferde tek satırla başla
    } else {
      failFields.classList.remove("show");
      defectsList.innerHTML = "";
      toggleNoDefects();
      addCategoryRow.classList.remove("show");
    }
  });
});

addCategoryToggle.addEventListener("click", () => {
  addCategoryRow.classList.toggle("show");
  if (addCategoryRow.classList.contains("show")) newCategoryName.focus();
});

addCategoryBtn.addEventListener("click", async () => {
  const name = newCategoryName.value.trim();
  if (!name) return;
  addCategoryBtn.disabled = true;
  try {
    const res = await fetch("/api/v1/defect-categories", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.detail || "Eklenemedi");
    await loadCategories(body.id); // yeni kategoriyle önceden seçili yeni bir satır ekler
    newCategoryName.value = "";
    addCategoryRow.classList.remove("show");
  } catch (err) {
    showBanner("error", `Hata türü eklenemedi: ${err.message}`);
  } finally {
    addCategoryBtn.disabled = false;
  }
});

function showBanner(type, html) {
  banner.className = `banner show ${type}`;
  banner.innerHTML = html;
}

function resetForm() {
  document.getElementById("insp-form").reset();
  resultBtns.forEach(b => b.classList.remove("active"));
  selectedResult = null;
  failFields.classList.remove("show");
  addCategoryRow.classList.remove("show");
  defectsList.innerHTML = "";
  toggleNoDefects();
  serialInput.focus();
}

document.getElementById("insp-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  banner.className = "banner";

  if (!selectedResult) {
    showBanner("error", "Önce OK ya da Hatalı seç.");
    return;
  }

  // Hatalı için: en az bir satırda hata türü seçili olmalı.
  let defects = [];
  if (selectedResult === "FAIL") {
    const rows = [...defectsList.querySelectorAll("[data-defect-row]")];
    defects = rows.map(row => ({
      defect_category_id: row.querySelector("[data-defect-category]").value,
      defect_reason: row.querySelector("[data-defect-note]").value.trim() || null,
    })).filter(d => d.defect_category_id);
    if (!defects.length) {
      showBanner("error", "Hatalı için en az bir hata türü seç.");
      return;
    }
  }

  const serial = serialInput.value.trim();
  const lineId = Number(lineSelect.value);

  submitBtn.disabled = true;
  submitBtn.textContent = "Kaydediliyor…";

  try {
    if (selectedResult === "PASS") {
      const body = await postInspection(serial, lineId, "PASS", null, null);
      showBanner("success", `Kaydedildi — TV #${body.tv_id}, sonuç: <b>OK</b> (TV durumu: ${body.tv_status})`);
    } else {
      // TV ilk kayıtta otomatik oluşturuluyor -- yarış durumuna girmemek için
      // satırları paralel değil, sırayla (birbiri ardına) gönderiyoruz.
      let lastBody = null;
      for (const d of defects) {
        lastBody = await postInspection(serial, lineId, "FAIL", Number(d.defect_category_id), d.defect_reason);
      }
      const plural = defects.length > 1 ? `${defects.length} hata` : "1 hata";
      showBanner("success", `Kaydedildi — TV #${lastBody.tv_id}, ${plural} eklendi (TV durumu: ${lastBody.tv_status})`);
    }
    resetForm();
  } catch (err) {
    showBanner("error", `Kaydedilemedi: ${err.message}`);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Kaydet";
  }
});

async function postInspection(serial, lineId, result, categoryId, reason) {
  const res = await fetch("/api/v1/inspections", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      serial_number: serial,
      production_line_id: lineId,
      result,
      defect_category_id: categoryId,
      defect_reason: reason,
    }),
  });
  const body = await res.json();
  if (!res.ok) throw new Error(body.detail || "Kayıt başarısız");
  return body;
}

loadLines();
loadCategories();
</script>
</body>
</html>
