<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kalite Dashboard — QualiTV</title>
<style>
  :root {
    color-scheme: light;
    --bg:            #f5f6f8;
    --surface:       #ffffff;
    --ink:           #10161c;
    --ink-2:         #55606b;
    --ink-3:         #8b96a1;
    --border:        #dde2e6;
    --accent:        #4a3aa7;
    --accent-soft:   #e6e2f7;
    --good:          #0ca30c;
    --warning:       #fab219;
    --serious:       #ec835a;
    --critical:      #d03b3b;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", "Consolas", monospace;
    --font-sans: ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0d1013; --surface: #15191d; --ink: #f2f4f6; --ink-2: #aab2ba; --ink-3: #757e87;
      --border: rgba(255,255,255,0.10); --accent: #9085e9; --accent-soft: #2a2350;
      --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d1013; --surface: #15191d; --ink: #f2f4f6; --ink-2: #aab2ba; --ink-3: #757e87;
    --border: rgba(255,255,255,0.10); --accent: #9085e9; --accent-soft: #2a2350;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e66767;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
  .page { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; display: flex; flex-direction: column; gap: 28px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); margin: 0 0 8px; }
  h1 { font-size: clamp(22px, 3vw, 30px); margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 13.5px; }
  .live-dot { display: inline-flex; align-items: center; gap: 6px; font-family: var(--font-mono); font-size: 11.5px; color: var(--good); }
  .live-dot i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); display: inline-block; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .kpi-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .kpi { background: var(--surface); padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; }
  .kpi-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-family: var(--font-mono); }
  .kpi-value { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 28px; font-weight: 600; }

  section.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 22px 24px 20px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px 16px; margin-bottom: 4px; }
  h2 { font-size: 15.5px; font-weight: 600; margin: 0; }
  .card-sub { font-size: 12.5px; color: var(--ink-2); }

  .severity-row { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .sev-item { display: grid; grid-template-columns: 90px 1fr 46px; align-items: center; gap: 12px; }
  .sev-label { font-size: 12.5px; font-family: var(--font-mono); display: flex; align-items: center; gap: 8px; }
  .sev-label i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .sev-track { height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; border: 1px solid var(--border); }
  .sev-fill { height: 100%; border-radius: 5px; transition: width .4s ease; }
  .sev-count { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; }

  .chart-scroll { overflow-x: auto; margin: 14px -4px 0; padding: 0 4px 6px; }
  .legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); font-family: var(--font-mono); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }

  .empty { text-align: center; padding: 40px 20px; color: var(--ink-2); font-size: 13.5px; }
  .empty b { color: var(--ink); }

  .tooltip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg); font-family: var(--font-mono); font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.18); opacity: 0; transition: opacity .08s ease; z-index: 20; white-space: nowrap; }
  .tooltip.show { opacity: 1; }

  a.back { color: var(--ink-2); font-size: 12.5px; text-decoration: none; }
  a.back:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow">Kalite &middot; Denetim Modülü</p>
    <h1>Kalite Dashboard</h1>
    <div class="sub" style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
      <span>Üretim verilerinden bağımsız — sadece audit/bulgu kayıtlarına dayanır</span>
      <span class="live-dot"><i></i>Canlı veri</span>
    </div>
  </header>

  <div id="content">
    <div class="empty">Yükleniyor…</div>
  </div>

  <a class="back" href="/docs">&larr; API dokümantasyonuna dön</a>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
const tooltip = document.getElementById("tooltip");
function showTip(evt, html) { tooltip.innerHTML = html; tooltip.classList.add("show"); moveTip(evt); }
function moveTip(evt) {
  const x = evt.clientX, y = evt.clientY;
  tooltip.style.left = Math.min(x + 14, window.innerWidth - tooltip.offsetWidth - 12) + "px";
  tooltip.style.top = Math.max(y - 14, 8) + "px";
}
function hideTip() { tooltip.classList.remove("show"); }
window.addEventListener("mousemove", moveTip);

async function loadDashboard() {
  const content = document.getElementById("content");
  try {
    const res = await fetch("/api/v1/quality-dashboard/summary");
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    render(data);
  } catch (err) {
    content.innerHTML = `<div class="empty">Veri alınamadı: <b>${err.message}</b><br>API'nin çalıştığından emin ol (<code>/api/v1/quality-dashboard/summary</code>).</div>`;
  }
}

function render(data) {
  const content = document.getElementById("content");

  if (data.total_audits === 0) {
    content.innerHTML = `<section class="card"><div class="empty">Henüz hiç audit kaydı yok.<br>İlk denetimi <code>POST /api/v1/audits</code> ile oluşturunca burası dolmaya başlayacak.</div></section>`;
    return;
  }

  const sev = data.severity_breakdown;
  const sevTotal = sev.low + sev.medium + sev.high + sev.critical || 1;
  const sevRows = [
    { key: "low", label: "LOW", color: "var(--good)", count: sev.low },
    { key: "medium", label: "MEDIUM", color: "var(--warning)", count: sev.medium },
    { key: "high", label: "HIGH", color: "var(--serious)", count: sev.high },
    { key: "critical", label: "CRITICAL", color: "var(--critical)", count: sev.critical },
  ];

  content.innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Toplam Denetim</div><div class="kpi-value">${data.total_audits}</div></div>
      <div class="kpi"><div class="kpi-label">Toplam Bulgu</div><div class="kpi-value">${data.total_findings}</div></div>
      <div class="kpi"><div class="kpi-label">Ort. Bulgu / Denetim</div><div class="kpi-value">${data.avg_findings_per_audit}</div></div>
    </div>

    <section class="card">
      <div class="card-head"><div><h2>Önem Derecesine Göre Bulgular</h2><div class="card-sub">Tüm zamanlar, ${data.total_findings} bulgu</div></div></div>
      <div class="severity-row" id="sev-rows"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <div><h2>Aylık Denetim Trendi</h2><div class="card-sub">Ay bazında denetim ve bulgu sayısı</div></div>
        <div class="legend"><span><i style="background:var(--accent)"></i>Denetim</span><span><i style="background:var(--ink-3)"></i>Bulgu</span></div>
      </div>
      <div class="chart-scroll"><svg id="chart-monthly" role="img" aria-label="Aylık denetim ve bulgu trendi"></svg></div>
    </section>
  `;

  const sevRowsEl = document.getElementById("sev-rows");
  sevRows.forEach(r => {
    const pct = (r.count / sevTotal) * 100;
    const row = document.createElement("div");
    row.className = "sev-item";
    row.innerHTML = `
      <div class="sev-label"><i style="background:${r.color}"></i>${r.label}</div>
      <div class="sev-track"><div class="sev-fill" style="width:${pct}%; background:${r.color}"></div></div>
      <div class="sev-count">${r.count}</div>
    `;
    sevRowsEl.appendChild(row);
  });

  drawMonthly(data.monthly);
}

function drawMonthly(monthly) {
  const svg = document.getElementById("chart-monthly");
  if (!monthly.length) {
    svg.parentElement.innerHTML = '<div class="empty">Henüz aylık trend için yeterli veri yok.</div>';
    return;
  }
  const groupW = 60, gap = 16, padL = 40, padR = 16, padT = 14, padB = 30;
  const plotH = 200;
  const w = padL + monthly.length * (groupW + gap) + padR;
  const h = padT + plotH + padB;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);

  const maxV = Math.max(...monthly.map(m => Math.max(m.audit_count, m.finding_count)), 1) * 1.15;
  const y = v => padT + plotH - (v / maxV) * plotH;

  [0, 0.25, 0.5, 0.75, 1].forEach(t => {
    const val = Math.round(maxV * t);
    const yy = y(val);
    svg.appendChild(el("line", { x1: padL - 6, x2: w - padR, y1: yy, y2: yy, stroke: "var(--border)", "stroke-width": 1 }));
    const txt = el("text", { x: padL - 10, y: yy + 3, "text-anchor": "end", "font-size": 9, fill: "var(--ink-3)", "font-family": "var(--font-mono)" });
    txt.textContent = val;
    svg.appendChild(txt);
  });

  monthly.forEach((m, i) => {
    const gx = padL + i * (groupW + gap);
    const barW = (groupW - 6) / 2;

    const yA = y(m.audit_count), hA = padT + plotH - yA;
    const rA = el("rect", { x: gx, y: yA, width: barW, height: hA, rx: 3, fill: "var(--accent)" });
    const gA = el("g");
    gA.appendChild(rA);
    gA.addEventListener("mousemove", e => showTip(e, `<b>${m.audit_month}</b><br>Denetim: <b>${m.audit_count}</b><br>Bulgu: <b>${m.finding_count}</b>`));
    gA.addEventListener("mouseleave", hideTip);
    svg.appendChild(gA);

    const yF = y(m.finding_count), hF = padT + plotH - yF;
    const rF = el("rect", { x: gx + barW + 6, y: yF, width: barW, height: Math.max(hF, m.finding_count > 0 ? 2 : 0), rx: 3, fill: "var(--ink-3)" });
    const gF = el("g");
    gF.appendChild(rF);
    gF.addEventListener("mousemove", e => showTip(e, `<b>${m.audit_month}</b><br>Denetim: <b>${m.audit_count}</b><br>Bulgu: <b>${m.finding_count}</b>`));
    gF.addEventListener("mouseleave", hideTip);
    svg.appendChild(gF);

    const lbl = el("text", { x: gx + groupW / 2, y: padT + plotH + 18, "text-anchor": "middle", "font-size": 10, fill: "var(--ink-2)", "font-family": "var(--font-mono)" });
    lbl.textContent = m.audit_month;
    svg.appendChild(lbl);
  });
}

loadDashboard();
</script>
</body>
</html>
